# RGB underglow: solid white at 20% on startup
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# Required for soft-off (MIRYOKU_KLUDGE_SOFT_OFF)
CONFIG_ZMK_PM_SOFT_OFF=y
